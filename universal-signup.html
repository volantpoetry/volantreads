<body>
<div class="container">

  <a href="#" id="backLink" class="back-link"><i class="fas fa-arrow-left"></i> Back</a>

  <div class="platform-badge" id="platformBadge">Volant Platform</div>

  <div class="breadcrumb" id="breadcrumb">
    <a href="#" id="breadcrumbHome">Home</a>
    <span>›</span>
    <span>Create Account</span>
  </div>

  <h2>Create account</h2>
  <p class="subtitle">Join us and start creating</p>

  <button id="googleSignUpBtn" class="google-btn">
    <i class="fab fa-google"></i>
    <span class="google-text">Sign up with Google</span>
  </button>

  <div class="divider-text">or sign up with email</div>

  <form id="signup-form" class="auth-form">
    <input type="hidden" id="signup-username-hidden">
    
    <label for="signup-email">Email address</label>
    <input type="email" id="signup-email" placeholder="you@example.com" 
           required autocomplete="email">
    <div class="field-hint">We'll send a verification link</div>

    <div id="password-section">
      <label for="signup-password">Password</label>
      <div class="password-wrapper">
        <input type="password" id="signup-password" placeholder="Create a strong password" 
               autocomplete="new-password">
        <span id="toggle-password" class="password-eye"><i class="far fa-eye"></i></span>
      </div>
      <div class="password-strength" id="passwordStrength"></div>
      <div class="field-hint">8+ characters with letters &amp; numbers recommended</div>
    </div>

    <div class="recaptcha-container">
      <div class="g-recaptcha" data-sitekey="6LfEe3wtAAAAACMvQc1vCwhgMtwvrH562PtKuXTU" data-callback="onRecaptchaSuccess"></div>
    </div>

    <button type="submit" class="btn-primary" id="signup-button" disabled>
      <span class="loading-spinner" id="spinner"><span class="spinner"></span></span>
      <span id="buttonText">Create Account</span>
    </button>
  </form>

  <div id="signup-status" class="status"></div>

  <div class="account-check">
    <span>Already have an account? </span>
    <a href="#" id="goToLogin">Sign in</a>
  </div>

  <div class="links">
    <small>By creating an account, you agree to our Terms of Service and Privacy Policy</small>
  </div>
</div>

<script>
  let recaptchaVerified = false;
  
  function onRecaptchaSuccess() {
    recaptchaVerified = true;
    const signupButton = document.getElementById('signup-button');
    signupButton.disabled = false;
  }
  
  function onRecaptchaExpired() {
    recaptchaVerified = false;
    const signupButton = document.getElementById('signup-button');
    signupButton.disabled = true;
    const statusEl = document.getElementById('signup-status');
    window.showStatus('⚠️ reCAPTCHA expired. Please verify again.', 'info');
  }

  window.showStatus = function(message, type = 'error') {
    const statusEl = document.getElementById('signup-status');
    statusEl.textContent = message;
    statusEl.className = `status show ${type}`;
  };
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth,
    createUserWithEmailAndPassword,
    sendEmailVerification,
    signOut,
    GoogleAuthProvider,
    signInWithPopup,
    signInWithRedirect,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore,
    doc,
    setDoc,
    getDoc,
    collection,
    query,
    where,
    getDocs,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC4DHI8aBVY4JjTvJ-r-TGIDPsewtEWxzU",
    authDomain: "silent-depth.firebaseapp.com",
    projectId: "silent-depth",
    storageBucket: "silent-depth.firebasestorage.app",
    messagingSenderId: "78008755450",
    appId: "1:78008755450:web:3fd0f0f298a08820935543",
    measurementId: "G-WSWDCB7KD8"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const urlParams = new URLSearchParams(window.location.search);
  const platform = urlParams.get('platform') || 'reads';
  const redirectUrl = urlParams.get('redirect');
  const isGoogleSignUp = urlParams.get('googleSignUp') === 'true';
  const suggestedUsername = urlParams.get('suggestedUsername') || '';

  const platformConfig = {
    poetry: { name: 'Volant Poetry', badge: 'poetry', homeUrl: '../index.html', color: '#4b2aad' },
    reads: { name: 'Volant Reads', badge: 'reads', homeUrl: 'index.html', color: '#d4a574' },
    foundry: { name: 'Volant Foundry', badge: 'foundry', homeUrl: '../volant_foundry/volant_foundry/index.html', color: '#2c3e50' }
  };
  const currentPlatform = platformConfig[platform] || platformConfig.poetry;

  document.getElementById('platformBadge').textContent = currentPlatform.name;
  document.getElementById('platformBadge').classList.add(currentPlatform.badge);

  const backLink = document.getElementById('backLink');
  const breadcrumbHome = document.getElementById('breadcrumbHome');
  if (redirectUrl) {
    backLink.href = redirectUrl;
    backLink.style.display = 'inline-flex';
    breadcrumbHome.href = redirectUrl;
    document.getElementById('breadcrumb').style.display = 'flex';
  }

  const signupForm = document.getElementById('signup-form');
  const signupButton = document.getElementById('signup-button');
  const statusEl = document.getElementById('signup-status');
  const passwordInput = document.getElementById('signup-password');
  const togglePassword = document.getElementById('toggle-password');
  const passwordStrength = document.getElementById('passwordStrength');
  const goToLogin = document.getElementById('goToLogin');
  const spinner = document.getElementById('spinner');
  const buttonText = document.getElementById('buttonText');
  const emailInput = document.getElementById('signup-email');
  const googleSignUpBtn = document.getElementById('googleSignUpBtn');
  const usernameHidden = document.getElementById('signup-username-hidden');
  const passwordSection = document.getElementById('password-section');

  let isGoogleSignUpSubmission = false;

  function showStatus(message, type = 'error') {
    statusEl.textContent = message;
    statusEl.className = `status show ${type}`;
  }

  // ============================================================
  // ====== GET THE CORRECT RETURN URL ======
  // ============================================================
  
  function getReturnUrl() {
    let returnUrl = redirectUrl;
    
    if (returnUrl) {
      try {
        returnUrl = decodeURIComponent(returnUrl);
        if (returnUrl.startsWith('/') || returnUrl.startsWith('../')) {
          const excludePages = ['login', 'signup', 'verify', 'reset', 'check-verification'];
          if (!excludePages.some(page => returnUrl.includes(page))) {
            console.log('✅ Using redirect URL from query param:', returnUrl);
            return returnUrl;
          }
        }
      } catch (e) {}
    }
    
    let storedUrl = sessionStorage.getItem('returnUrl') || sessionStorage.getItem('preLoginPage');
    if (storedUrl && storedUrl !== 'null' && storedUrl !== 'undefined') {
      try {
        storedUrl = decodeURIComponent(storedUrl);
        const excludePages = ['login', 'signup', 'verify', 'reset', 'check-verification'];
        if (!excludePages.some(page => storedUrl.includes(page))) {
          console.log('✅ Using stored return URL:', storedUrl);
          return storedUrl;
        }
      } catch (e) {}
    }
    
    const referrer = document.referrer;
    if (referrer && !referrer.includes('login') && !referrer.includes('signup')) {
      try {
        const url = new URL(referrer);
        const path = url.pathname + url.search;
        if (path && path !== '/') {
          console.log('✅ Using referrer URL:', path);
          return path;
        }
      } catch (e) {}
    }
    
    console.log('ℹ️ Using default home URL:', currentPlatform.homeUrl);
    return currentPlatform.homeUrl;
  }

  // ============================================================
  // ====== REDIRECT AFTER SIGNUP ======
  // ============================================================
  
  function redirectAfterSignup() {
    const returnUrl = getReturnUrl();
    
    sessionStorage.removeItem('returnUrl');
    sessionStorage.removeItem('preLoginPage');
    localStorage.removeItem('returnUrl');
    sessionStorage.removeItem('googleSignUpData');
    
    console.log('🔄 Redirecting to:', returnUrl);
    
    setTimeout(() => {
      window.location.href = returnUrl;
    }, 500);
  }

  // ============================================================
  // ====== UNIQUE USERNAME GENERATOR ======
  // ============================================================
  
  async function isUsernameTaken(username) {
    if (!username || username.length < 3) return false;
    try {
      const q = query(collection(db, 'users'), where('username', '==', username));
      const querySnap = await getDocs(q);
      return !querySnap.empty;
    } catch (err) {
      console.error('Error checking username:', err);
      return false;
    }
  }

  async function generateUniqueUsername(baseName) {
    if (!baseName || baseName.length < 3) {
      baseName = 'user';
    }
    
    let clean = baseName
      .replace(/\s/g, '_')
      .toLowerCase()
      .replace(/[^a-z0-9_]/g, '')
      .substring(0, 11);
    
    if (!clean || clean.length < 3) {
      clean = 'user_' + Math.random().toString(36).substring(2, 6);
    }
    
    const taken = await isUsernameTaken(clean);
    if (!taken) {
      return clean;
    }
    
    let counter = 1;
    let newUsername;
    do {
      const suffix = counter.toString();
      const maxLen = 11 - suffix.length;
      const base = clean.substring(0, maxLen);
      newUsername = base + suffix;
      counter++;
      if (counter > 100) break;
    } while (await isUsernameTaken(newUsername));
    
    return newUsername || clean + '_' + Date.now().toString(36);
  }

  // ============================================================
  // ====== CHECK FOR GOOGLE SIGN-UP DATA ======
  // ============================================================
  
  if (isGoogleSignUp) {
    const googleData = sessionStorage.getItem('googleSignUpData');
    if (googleData) {
      try {
        const data = JSON.parse(googleData);
        if (data.email) {
          emailInput.value = data.email;
          emailInput.disabled = true;
          passwordSection.style.display = 'none';
          
          let username = suggestedUsername;
          if (!username && data.displayName) {
            username = data.displayName
              .replace(/\s/g, '_')
              .toLowerCase()
              .replace(/[^a-z0-9_]/g, '')
              .substring(0, 11);
          }
          if (!username || username.length < 3) {
            username = 'user';
          }
          
          generateUniqueUsername(username).then(uniqueUsername => {
            usernameHidden.value = uniqueUsername;
            showStatus('📝 Username "' + uniqueUsername + '" generated for you.', 'info');
            
            isGoogleSignUpSubmission = true;
            setTimeout(() => {
              signupForm.dispatchEvent(new Event('submit'));
            }, 500);
          });
          
          showStatus('📝 Complete your registration with Google account', 'info');
        }
      } catch (e) {
        console.error('Error parsing Google data:', e);
      }
    }
  }

  passwordInput.addEventListener('input', () => {
    const pwd = passwordInput.value;
    let strength = 'weak';
    let message = 'Weak password';

    if (pwd.length >= 8) {
      if (/[a-z]/.test(pwd) && /[A-Z]/.test(pwd) && /[0-9]/.test(pwd)) {
        strength = 'strong';
        message = '✅ Strong password';
      } else if (/[a-z]/.test(pwd) && /[0-9]/.test(pwd)) {
        strength = 'medium';
        message = '⚠️ Medium strength';
      } else if (pwd.length >= 10) {
        strength = 'medium';
        message = '⚠️ Medium strength';
      }
    }
    if (pwd.length > 0) {
      passwordStrength.textContent = message;
      passwordStrength.className = `password-strength show ${strength}`;
    } else {
      passwordStrength.classList.remove('show');
    }
  });

  togglePassword.addEventListener("click", () => {
    const isPassword = passwordInput.type === "password";
    passwordInput.type = isPassword ? "text" : "password";
    togglePassword.classList.toggle("showing", isPassword);
    togglePassword.innerHTML = isPassword ? '<i class="fas fa-eye-slash"></i>' : '<i class="far fa-eye"></i>';
  });

  goToLogin.addEventListener('click', (e) => {
    e.preventDefault();
    sessionStorage.removeItem('googleSignUpData');
    const params = new URLSearchParams();
    params.append('platform', platform);
    if (redirectUrl) params.append('redirect', redirectUrl);
    window.location.href = `universal-login.html?${params.toString()}`;
  });

  // ============================================================
  // ====== GOOGLE SIGN-UP HANDLER ======
  // ============================================================
  
  async function signUpWithGoogle() {
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    
    googleSignUpBtn.disabled = true;
    googleSignUpBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Connecting...';
    
    try {
      showStatus('Connecting to Google...', 'info');
      
      let result;
      try {
        result = await signInWithPopup(auth, provider);
      } catch (popupError) {
        if (popupError.code === 'auth/popup-blocked' || 
            popupError.code === 'auth/popup-closed-by-user' ||
            popupError.code === 'auth/cancelled-popup-request') {
          await signInWithRedirect(auth, provider);
          return;
        }
        throw popupError;
      }
      
      const user = result.user;
      
      const userDoc = await getDoc(doc(db, 'users', user.uid));
      
      if (userDoc.exists()) {
        showStatus('⚠️ Account already exists. Please sign in.', 'info');
        await signOut(auth);
        
        setTimeout(() => {
          const params = new URLSearchParams();
          params.append('platform', platform);
          if (redirectUrl) params.append('redirect', redirectUrl);
          window.location.href = `universal-login.html?${params.toString()}`;
        }, 1500);
        return;
      }
      
      let baseUsername = user.displayName || 'user';
      let clean = baseUsername
        .replace(/\s/g, '_')
        .toLowerCase()
        .replace(/[^a-z0-9_]/g, '')
        .substring(0, 11);
      
      if (!clean || clean.length < 3) {
        clean = 'user';
      }
      
      const uniqueUsername = await generateUniqueUsername(clean);
      
      emailInput.value = user.email || '';
      emailInput.disabled = true;
      usernameHidden.value = uniqueUsername;
      passwordSection.style.display = 'none';
      
      sessionStorage.setItem('googleSignUpData', JSON.stringify({
        email: user.email,
        displayName: user.displayName,
        photoURL: user.photoURL,
        uid: user.uid,
        username: uniqueUsername
      }));
      
      showStatus('📝 Username "' + uniqueUsername + '" assigned. Creating account...', 'info');
      
      isGoogleSignUpSubmission = true;
      setTimeout(() => {
        signupForm.dispatchEvent(new Event('submit'));
      }, 1000);
      
    } catch (error) {
      console.error('Google Sign-Up error:', error);
      
      if (error.code === 'auth/account-exists-with-different-credential') {
        showStatus('An account already exists with this email. Please sign in.', 'info');
        setTimeout(() => {
          const params = new URLSearchParams();
          params.append('platform', platform);
          if (redirectUrl) params.append('redirect', redirectUrl);
          window.location.href = `universal-login.html?${params.toString()}`;
        }, 1500);
      } else {
        showStatus('Google sign-up failed. Please try again or use email.', 'error');
      }
      
      googleSignUpBtn.disabled = false;
      googleSignUpBtn.innerHTML = '<i class="fab fa-google"></i><span class="google-text">Sign up with Google</span>';
      isGoogleSignUpSubmission = false;
    }
  }

  googleSignUpBtn.addEventListener('click', signUpWithGoogle);

  // ============================================================
  // ====== EMAIL SIGNUP ======
  // ============================================================
  
  signupForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const googleData = sessionStorage.getItem('googleSignUpData');
    const isGoogleUser = googleData && emailInput.disabled === true;

    if (!isGoogleUser && !recaptchaVerified) {
      showStatus('⚠️ Please complete the reCAPTCHA verification.', 'error');
      return;
    }

    const email = emailInput.value;
    const password = passwordInput.value;

    signupButton.disabled = true;
    spinner.style.display = 'inline';
    buttonText.textContent = 'Creating account…';

    try {
      let user;
      
      if (isGoogleUser && googleData) {
        const data = JSON.parse(googleData);
        user = auth.currentUser;
        
        if (!user) {
          showStatus('❌ Google session expired. Please try again.', 'error');
          signupButton.disabled = false;
          spinner.style.display = 'none';
          buttonText.textContent = 'Create Account';
          isGoogleSignUpSubmission = false;
          return;
        }
        
        let username = usernameHidden.value || data.username;
        if (!username || username.length < 3) {
          username = await generateUniqueUsername(data.displayName || 'user');
        }
        
        const isTaken = await isUsernameTaken(username);
        if (isTaken) {
          username = await generateUniqueUsername(data.displayName || 'user');
        }
        
        await setDoc(doc(db, 'users', user.uid), {
          username: username,
          email: email,
          displayName: data.displayName || username,
          photoURL: data.photoURL || '',
          createdAt: serverTimestamp(),
          platform: platform,
          emailVerified: user.emailVerified,
          authProvider: 'google',
          lastLogin: serverTimestamp()
        });
        
        sessionStorage.removeItem('googleSignUpData');
        showStatus('✅ Account created with Google! Redirecting…', 'success');
        
        // ✅ SUCCESS - Redirect back
        redirectAfterSignup();
        return;
        
      } else {
        // Email signup
        if (!password || password.length < 6) {
          showStatus('❌ Password must be at least 6 characters.', 'error');
          signupButton.disabled = false;
          spinner.style.display = 'none';
          buttonText.textContent = 'Create Account';
          return;
        }
        
        const emailQuery = query(collection(db, 'users'), where('email', '==', email));
        const emailSnap = await getDocs(emailQuery);
        if (!emailSnap.empty) {
          showStatus('❌ Email already registered');
          signupButton.disabled = false;
          spinner.style.display = 'none';
          buttonText.textContent = 'Create Account';
          return;
        }

        let baseUsername = email.split('@')[0];
        if (!baseUsername || baseUsername.length < 3) {
          baseUsername = 'user';
        }
        const username = await generateUniqueUsername(baseUsername);

        const userCred = await createUserWithEmailAndPassword(auth, email, password);
        user = userCred.user;

        await sendEmailVerification(user);

        await setDoc(doc(db, 'users', user.uid), {
          username: username,
          email: email,
          createdAt: serverTimestamp(),
          platform: platform,
          emailVerified: false,
          authProvider: 'email'
        });

        showStatus('✅ Account created! Verification email sent. Redirecting…', 'success');

        const verifyParams = new URLSearchParams();
        verifyParams.append('email', email);
        verifyParams.append('platform', platform);
        if (redirectUrl) verifyParams.append('redirect', redirectUrl);

        await signOut(auth);

        setTimeout(() => {
          window.location.href = `verify-email.html?${verifyParams.toString()}`;
        }, 2000);
        return;
      }

    } catch (err) {
      console.error('Signup error:', err);
      let errorMsg = '❌ ' + err.message;
      if (err.code === 'auth/email-already-in-use') errorMsg = '❌ Email already registered';
      else if (err.code === 'auth/weak-password') errorMsg = '❌ Password should be at least 6 characters';
      else if (err.code === 'auth/invalid-email') errorMsg = '❌ Invalid email address';
      showStatus(errorMsg);
      signupButton.disabled = false;
      spinner.style.display = 'none';
      buttonText.textContent = 'Create Account';
      isGoogleSignUpSubmission = false;
    }
  });

  onAuthStateChanged(auth, (user) => {
    if (user && emailInput.disabled && sessionStorage.getItem('googleSignUpData')) {
      // User is authenticated with Google, but not yet in Firestore
    }
  });

</script>
